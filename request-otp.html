<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - CV Builder</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      :root {
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --error: #ef4444;
        --success: #10b981;
        --warning: #f59e0b;
        --text: #334155;
        --text-light: #64748b;
        --border: #e2e8f0;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 480px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        padding: 40px 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .header p {
        opacity: 0.9;
      }

      .content {
        padding: 40px 30px;
      }

      .spam-warning {
        background: #fff3cd;
        border: 1px solid #ffeeba;
        color: #856404;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 25px;
        font-size: 14px;
      }

      .env-indicator {
        background: #e0e7ff;
        border: 1px solid #a5b4fc;
        color: #1e40af;
        padding: 8px 12px;
        border-radius: 20px;
        margin-bottom: 20px;
        font-size: 12px;
        text-align: center;
        display: inline-block;
        width: auto;
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text);
      }

      .input-container {
        position: relative;
      }

      input {
        width: 100%;
        padding: 14px 16px 14px 46px;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-light);
      }

      button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .message {
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
        display: none;
      }

      .message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .back-link {
        text-align: center;
        margin-top: 25px;
      }

      .back-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .resend-timer {
        text-align: center;
        margin-top: 15px;
        color: var(--text-light);
        font-size: 14px;
      }

      .resend-link {
        color: var(--primary);
        cursor: pointer;
        text-decoration: underline;
      }

      .resend-link.disabled {
        color: var(--text-light);
        cursor: not-allowed;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🔐 Reset Password</h1>
        <p>Enter your email to receive OTP</p>
      </div>

      <div class="content">
        <!-- Environment Indicator -->
        <div style="text-align: center; margin-bottom: 20px">
          <span class="env-indicator" id="envIndicator"
            >Loading environment...</span
          >
        </div>

        <!-- Spam Warning -->
        <div class="spam-warning">
          <i class="fas fa-exclamation-triangle"></i>
          <strong>Check your spam folder!</strong>
          The OTP email might land there. Add us to your contacts.
        </div>

        <!-- Message Display -->
        <div id="messageBox" class="message"></div>

        <!-- Request Form -->
        <div id="requestForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-container">
              <i class="fas fa-envelope input-icon"></i>
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <button onclick="requestOtp()" id="requestBtn">
            <i class="fas fa-paper-plane"></i>
            Send OTP
          </button>
        </div>

        <!-- Success State (hidden) -->
        <div id="successState" style="display: none">
          <div class="message success">
            <i class="fas fa-check-circle"></i>
            <strong>OTP Sent!</strong>
            <p style="margin-top: 10px">
              Please check your email for the 6-digit OTP.
            </p>
          </div>

          <!-- OTP Input -->
          <div class="form-group">
            <label for="otp">Enter 6-Digit OTP</label>
            <div class="input-container">
              <i class="fas fa-key input-icon"></i>
              <input
                type="text"
                id="otp"
                maxlength="6"
                placeholder="123456"
                style="font-size: 24px; letter-spacing: 8px; text-align: center"
              />
            </div>
            <div style="text-align: right; margin-top: 5px">
              <span
                id="timerDisplay"
                style="color: var(--primary); font-weight: 600"
                >05:00</span
              >
            </div>
          </div>

          <button onclick="verifyOtp()" id="verifyBtn">
            <i class="fas fa-check-circle"></i>
            Verify OTP
          </button>

          <div class="resend-timer" id="resendSection">
            <span id="resendTimer"></span>
          </div>
        </div>

        <div class="back-link">
          <a href="index.html"
            ><i class="fas fa-arrow-left"></i> Back to Login</a
          >
        </div>
      </div>
    </div>

    <script>
      // ==================== SMART API CONFIGURATION ====================
      const getApiBaseUrl = () => {
        const hostname = window.location.hostname;

        // Check if running locally
        if (hostname === "localhost" || hostname === "127.0.0.1") {
          console.log("Local development detected");
          return "http://localhost:5000/api";
        }

        // Default to production
        console.log("Production environment detected");
        return "https://cv-builder-backend-qtpb.onrender.com/api";
      };

      const API_BASE_URL = getApiBaseUrl();

      // Display environment indicator
      const envIndicator = document.getElementById("envIndicator");
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        envIndicator.innerHTML =
          '<i class="fas fa-laptop-code"></i> Running Locally';
        envIndicator.style.background = "#dbeafe";
      } else {
        envIndicator.innerHTML = '<i class="fas fa-cloud"></i> Your Live';
        envIndicator.style.background = "#dcfce7";
      }

      console.log(`✅ API Endpoint: ${API_BASE_URL}`);

      // Test backend connection on load
      const testBackendConnection = async () => {
        try {
          const response = await fetch(`${API_BASE_URL}/health`);
          if (response.ok) {
            console.log("✅ Backend connection successful");
          } else {
            console.warn("⚠️ Backend returned error");
          }
        } catch (error) {
          console.error("❌ Backend connection failed:", error.message);
          showMessage(
            "error",
            "❌ Connection Error",
            "Cannot connect to server. Please check if backend is running.",
          );
        }
      };

      testBackendConnection();

      // ==================== REST OF YOUR CODE ====================
      let timerInterval;
      let userEmail = "";

      function showMessage(type, title, message) {
        const msgBox = document.getElementById("messageBox");
        msgBox.className = `message ${type}`;
        msgBox.innerHTML = `<strong>${title}</strong><br>${message}`;
        msgBox.style.display = "block";
      }

      async function requestOtp() {
        const email = document.getElementById("email").value.trim();
        const requestBtn = document.getElementById("requestBtn");

        if (!email) {
          showMessage("error", "❌ Error", "Please enter your email");
          return;
        }

        userEmail = email;
        requestBtn.disabled = true;
        requestBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
          const response = await fetch(`${API_BASE_URL}/auth/request-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          if (response.ok) {
            document.getElementById("requestForm").style.display = "none";
            document.getElementById("successState").style.display = "block";
            showMessage(
              "success",
              "✅ OTP Sent!",
              data.note || "Check your email for the OTP.",
            );
            startTimer(300); // 5 minutes
          } else {
            showMessage(
              "error",
              "❌ Error",
              data.error || "Something went wrong",
            );
            requestBtn.disabled = false;
            requestBtn.innerHTML =
              '<i class="fas fa-paper-plane"></i> Send OTP';
          }
        } catch (error) {
          showMessage(
            "error",
            "❌ Network Error",
            "Unable to connect to server. Please check if backend is running.",
          );
          requestBtn.disabled = false;
          requestBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        }
      }

      async function verifyOtp() {
        const otp = document.getElementById("otp").value.trim();
        const verifyBtn = document.getElementById("verifyBtn");

        if (!otp || otp.length !== 6 || !/^\d+$/.test(otp)) {
          showMessage("error", "❌ Error", "Please enter a valid 6-digit OTP");
          return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Verifying...';

        try {
          const response = await fetch(`${API_BASE_URL}/auth/verify-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, otp }),
          });

          const data = await response.json();

          if (response.ok) {
            // Store reset token and redirect to new password page
            localStorage.setItem("resetToken", data.resetToken);
            localStorage.setItem("resetEmail", userEmail);
            window.location.href = "new-password.html";
          } else {
            showMessage("error", "❌ Error", data.error || "Invalid OTP");
            verifyBtn.disabled = false;
            verifyBtn.innerHTML =
              '<i class="fas fa-check-circle"></i> Verify OTP';
          }
        } catch (error) {
          showMessage(
            "error",
            "❌ Network Error",
            "Unable to connect to server",
          );
          verifyBtn.disabled = false;
          verifyBtn.innerHTML =
            '<i class="fas fa-check-circle"></i> Verify OTP';
        }
      }

      function startTimer(duration) {
        const timerDisplay = document.getElementById("timerDisplay");
        const resendSection = document.getElementById("resendSection");
        let timeLeft = duration;

        clearInterval(timerInterval);

        timerInterval = setInterval(() => {
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          timerDisplay.textContent = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerDisplay.textContent = "00:00";
            resendSection.innerHTML =
              '<span>OTP expired. <a class="resend-link" onclick="resendOtp()">Resend OTP</a></span>';
          }
          timeLeft--;
        }, 1000);
      }

      async function resendOtp() {
        document.getElementById("resendSection").innerHTML =
          "<span>Sending...</span>";
        await requestOtp();
      }
    </script>
  </body>
</html>
